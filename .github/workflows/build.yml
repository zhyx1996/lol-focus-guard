name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译（系统自带 csc，无需 SDK）
        shell: pwsh
        run: ./build.ps1 -SkipStop

      - name: 规则与事件序列回归测试
        shell: pwsh
        run: |
          ./LogicTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./StateTest.exe
          exit $LASTEXITCODE

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LolFocusGuard
          path: LolFocusGuard.exe
